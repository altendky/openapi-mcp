coverage:
  status:
    project:
      default:
        threshold: 2%
    patch:
      default:
        target: 100%

comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true

flags:
  rust:
    paths:
      - crates/
    carryforward: true
  npm:
    paths:
      - npm/openapi-mcp-rs/
    carryforward: true

component_management:
  individual_components:
    - component_id: rust
      name: Rust
      paths:
        - crates/**
    - component_id: npm
      name: npm wrapper
      paths:
        - npm/openapi-mcp-rs/**
