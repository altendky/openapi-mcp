[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.2-dev.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/altendky/openapi-mcp"

[workspace.dependencies]
openapi-mcp-spec = { path = "crates/openapi-mcp-spec", version = "0.1.2-dev.0" }
openapi-mcp-core = { path = "crates/openapi-mcp-core", version = "0.1.2-dev.0" }
openapi-mcp-io = { path = "crates/openapi-mcp-io", version = "0.1.2-dev.0" }
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rmcp = "3.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tempfile = "3"
url = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
