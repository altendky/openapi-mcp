name: Project check

on:
  workflow_call:
    inputs:
      task:
        description: Mise validation task
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ inputs.task }}
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Cache pre-commit environments
        if: inputs.task == 'pre-commit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml', 'mise.lock') }}
      - name: Run check
        env:
          TASK: ${{ inputs.task }}
        run: mise run "$TASK"
