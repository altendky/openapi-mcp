name: Publish release

on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  cargo:
    if: vars.RELEASE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BOOTSTRAP_TOKEN_AVAILABLE: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: cargo-publish
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: dist/release
      - name: Obtain crates.io trusted-publishing token
        if: env.BOOTSTRAP_TOKEN_AVAILABLE != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: python scripts/release_publish.py cargo dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}

  npm:
    needs: cargo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: dist/release
      - run: python scripts/release_publish.py npm dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry-test:
    needs: npm
    name: Registry smoke (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: false
      - run: python scripts/release_publish.py smoke

  github:
    needs: registry-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundle
          path: dist/release
      - run: python scripts/release_publish.py github dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}

  post-release:
    needs: github
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - run: python .github/scripts/release-github.py post-release --tag "$TAG"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ github.ref_name }}
