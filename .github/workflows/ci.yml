name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: python scripts/check-versions.py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.89 --profile minimal
      - run: cargo +1.89 check --workspace --all-targets --all-features --locked

  test-and-package:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: openapi-mcp
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: openapi-mcp
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: openapi-mcp
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: openapi-mcp
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: openapi-mcp.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo +stable test --workspace --all-features --locked
      - run: cargo +stable build --release --locked --target ${{ matrix.target }} -p openapi-mcp
      - name: Check static Linux binary
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - run: python scripts/smoke-test.py -- target/${{ matrix.target }}/release/${{ matrix.binary }}
      - run: npm ci --prefix npm/openapi-mcp-rs
      - run: npm test --prefix npm/openapi-mcp-rs
      - run: python scripts/package-npm.py --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --platform ${{ matrix.platform }}
      - run: python scripts/test-npm-package.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ matrix.platform }}
          path: dist/*.tgz
