name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: checks
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise install --locked --dry-run
      - run: mise run fmt
      - run: mise run clippy
      - run: mise run versions
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release-version.py check --tag "$TAG"
      - run: mise run release-test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read minimum supported Rust version
        id: msrv
        run: python -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv
      - run: python scripts/check.py msrv

  test-and-package:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      MERGIFY_TOKEN_AVAILABLE: ${{ secrets.MERGIFY_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: openapi-mcp
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: openapi-mcp
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: openapi-mcp
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: openapi-mcp
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: openapi-mcp.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: test-${{ matrix.platform }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: mise run test
      - name: Upload JUnit results
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.platform }}
          path: target/nextest/ci/junit.xml
      - name: Upload test results to Mergify CI Insights
        if: ${{ !cancelled() && env.MERGIFY_TOKEN_AVAILABLE == 'true' && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@5e8176734bc525c7fd8b2e812f0fa47246f601b7 # v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: target/nextest/ci/junit.xml
          job_name: Test and package (${{ matrix.platform }})
      - run: cargo build --release --locked --target ${{ matrix.target }} -p openapi-mcp
      - name: Check static Linux binary
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - run: mise run smoke -- --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - run: mise run npm-test
      - run: mise run package-test -- --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --platform ${{ matrix.platform }}
      - run: python scripts/release_artifacts.py pack --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ matrix.platform }}
          path: dist/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/native/*
          if-no-files-found: error

  cargo-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          # Cargo's extracted package trees are temporary verification inputs.
          # rust-cache cleanup reports errors while traversing those trees.
          cache: false
      - run: cargo package --workspace --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crates
          path: target/package/*.crate
          if-no-files-found: error

  release-artifacts:
    needs: [test-and-package, cargo-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - run: python scripts/release_artifacts.py bundle --input artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundle
          path: dist/release/*
          if-no-files-found: error

  validation:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, docs, security]
    uses: ./.github/workflows/reflow-check.yml
    with:
      task: ${{ matrix.task }}

  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reflow-coverage.yml

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [checks, msrv, test-and-package, cargo-package, release-artifacts, validation, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  tag-release:
    needs: all
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'altendky/openapi-mcp' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/reflow-tag-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release:
    needs: all
    if: >-
      vars.RELEASE_ENABLED == 'true' && github.repository == 'altendky/openapi-mcp' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/reflow-release.yml
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
