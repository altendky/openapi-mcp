name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: checks
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise install --locked --dry-run
      - run: mise run fmt
      - run: mise run clippy
      - run: mise run versions

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read minimum supported Rust version
        id: msrv
        run: python -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-key: msrv
      - run: python scripts/check.py msrv

  test-and-package:
    name: Test and package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      MERGIFY_TOKEN_AVAILABLE: ${{ secrets.MERGIFY_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: openapi-mcp
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: openapi-mcp
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: openapi-mcp
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: openapi-mcp
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: openapi-mcp.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: test-${{ matrix.platform }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: mise run test
      - name: Upload JUnit results
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-${{ matrix.platform }}
          path: target/nextest/ci/junit.xml
      - name: Upload test results to Mergify CI Insights
        if: ${{ !cancelled() && env.MERGIFY_TOKEN_AVAILABLE == 'true' && hashFiles('target/nextest/ci/junit.xml') != '' }}
        uses: mergifyio/gha-mergify-ci@5e8176734bc525c7fd8b2e812f0fa47246f601b7 # v25
        with:
          token: ${{ secrets.MERGIFY_TOKEN }}
          report_path: target/nextest/ci/junit.xml
          job_name: Test and package (${{ matrix.platform }})
      - run: cargo build --release --locked --target ${{ matrix.target }} -p openapi-mcp
      - name: Check static Linux binary
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        env:
          BINARY: target/${{ matrix.target }}/release/${{ matrix.binary }}
        run: file "$BINARY" | grep -E 'statically linked|static-pie linked'
      - run: mise run smoke -- --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
      - run: mise run npm-test
      - run: mise run package-test -- --binary target/${{ matrix.target }}/release/${{ matrix.binary }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-${{ matrix.platform }}
          path: dist/*.tgz

  validation:
    name: ${{ matrix.task }}
    strategy:
      fail-fast: false
      matrix:
        task: [pre-commit, docs, security]
    uses: ./.github/workflows/reflow-check.yml
    with:
      task: ${{ matrix.task }}

  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reflow-coverage.yml

  all:
    name: all
    if: ${{ !cancelled() }}
    needs: [checks, msrv, test-and-package, validation, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
