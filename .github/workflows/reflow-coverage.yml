name: Coverage

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: coverage
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - run: mise run coverage
      - name: Save coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            target/coverage/rust.lcov
            npm/openapi-mcp-rs/coverage/lcov.info
      - name: Upload Rust coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: target/coverage/rust.lcov
          disable_search: true
          flags: rust
          fail_ci_if_error: true
      - name: Upload npm coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: npm/openapi-mcp-rs/coverage/lcov.info
          disable_search: true
          flags: npm
          fail_ci_if_error: true
