name: Setup Rust
description: Install the project toolchain and cache Cargo builds

inputs:
  toolchain:
    description: Override the toolchain in rust-toolchain.toml
    required: false
    default: ""
  targets:
    description: Additional compilation targets
    required: false
    default: ""
  cache-key:
    description: Distinguish caches for different build jobs
    required: false
    default: ""
  cache:
    description: Cache Cargo builds on non-tag runs
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
      with:
        toolchain: ${{ inputs.toolchain }}
        target: ${{ inputs.targets }}
        cache-key: ${{ inputs.cache-key }}
        cache: ${{ inputs.cache == 'true' && !startsWith(github.ref, 'refs/tags/') }}
